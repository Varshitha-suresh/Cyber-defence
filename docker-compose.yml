version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cyber_defence_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cyber_defence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cyber_defence_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/cyber_defence
      JWT_SECRET: super-secret-cyber-defence-jwt-key-change-in-production-min32chars
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: cyber_defence_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
